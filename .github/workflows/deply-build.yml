name: Deploy to Kourva.github.io

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npm run generate
        env:
          # Base URL is the root domain, not a subpath
          NUXT_APP_BASE_URL: /

      - name: Deploy to Kourva.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: Kourva/Kourva.github.io
          publish_branch: main
          publish_dir: ./.output/public
          force_orphan: true
